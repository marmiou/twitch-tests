[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
skip = ["env", "venv"]

[tool.poetry]
name = "sporty-tests"
version = "0.1.0"
description = ""
authors = ["Markella Efthymiou <efthymioumarkella@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
selenium = "^4.52.0"
pytest = "^9.2.0"
webdriver-manager = "^4.1.2"
allure-pytest = "^2.16.2"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
pylint = "^4.1.3"

[tool.pytest.ini_options]
addopts = [
    "--clean-alluredir",
    "--alluredir=reports/allure-results",
    "--allure-link-pattern",
    "issue:https://{}",
    "--allure-link-pattern",
    "link:https://{}",
    "--allure-link-pattern",
    "tms:https://{}",
    "--color=yes",
    "-s",
    "-p no:logging"
]

markers = [
    "smoke: marks tests that run before merge to the main branch",
    "regression: marks tests that run manually or nightly after merge to the main branch",
    "streamer: marks streamer tests"
]

testpaths = [
    "tests"
]