
name: Run UI tests automatically on push

on:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  run-ui-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install Poetry
        run: |
          python -m pip install poetry

      - name: Install Allure (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -fsSL https://github.com/allure-framework/allure2/releases/latest/download/allure-2.35.1.tgz -o allure.tgz
          sudo tar -xzf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.35.1/bin/allure /usr/local/bin/allure

      - name: Install Allure (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install allure

      - name: Install project dependencies
        run: |
          poetry install --no-interaction

      - name: Verify installations
        run: |
          python --version
          poetry --version
          allure --version

      - name: Run tests
        run: |
          poetry run pytest --headless --alluredir=reports/allure-results

      - name: Generate Allure report
        if: always() && hashFiles('reports/allure-results/**') != ''
        run: |
          allure generate reports/allure-results \
            -o reports/allure-report \
            --clean

      - name: Archive Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.os }}
          path: reports/allure-report
          if-no-files-found: ignore
          retention-days: 14
